name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contract hash (must match bilig_back)
        run: npm run contract:hash
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & component tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size (initial JS ≤ 250 KB gzip, no mocks in prod)
        run: npm run size

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E (TZ §3 scenarios + axe) against MSW mocks
        run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
